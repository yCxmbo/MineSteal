# =============================================
#   MineSteal Configuration
#   Plugin version: 2.0.0
#   GitHub: https://github.com/ycxmbo/minesteal
# =============================================

# ---- Core Settings ----
settings:
  # HP per heart (Vanilla = 2). Do not change unless you know what you're doing.
  hp-per-heart: 2
  # Max hearts a player can have
  max-hearts: 40
  # Minimum hearts before deathban triggers
  minimum-hearts: 5
  # Starting hearts for brand-new players
  starting-hearts: 10
  # Hearts gained by killer on PvP kill
  hearts-on-kill: 1
  # Hearts lost by victim on PvP kill
  hearts-on-death: 1
  # Allow self-kills to steal hearts (e.g., fall damage with a player nearby)
  allow-self-kill: false
  # Enable debug mode (verbose logging)
  debug: false

# ---- Database ----
database:
  # Type: SQLITE or MYSQL
  type: SQLITE
  # SQLite file location (relative to plugin data folder)
  sqlite-file: data/minesteal.db
  # MySQL settings (only used when type: MYSQL)
  mysql:
    host: localhost
    port: 3306
    database: minesteal
    username: root
    password: ''
    # Connection pool settings
    pool-size: 10
    connection-timeout: 30000
    idle-timeout: 600000
    max-lifetime: 1800000
    use-ssl: false

# ---- Death & Deathban ----
death:
  # Drop heart item on victim's death location
  drop-hearts-on-death: true
  # Automatically transfer hearts to killer instead of dropping
  auto-transfer: false
  # Broadcast kill message to all players
  broadcast-kill: true
  # Enable lightning strike effect at kill location
  lightning-on-kill: true
  # Kill effects (particles, sounds, title to killer)
  kill-effects:
    enabled: true
    particle: HEART
    sound: ENTITY_PLAYER_LEVELUP
    title-to-killer: '&c%victim% &7was slain!'
    title-to-victim: '&cYou died!'
    broadcast: '&c%killer% &7eliminated &c%victim% &7and stole &c%amount% &7heart(s)!'

  deathban:
    enabled: true
    # SPECTATOR = soft ban (spectator mode until revived)
    # BAN = hard server ban (requires LiteBans or compatible plugin)
    mode: SPECTATOR
    reason: 'You ran out of hearts!'
    ban-duration: 'permanent'
    # Command run on ban (%player% = IGN, %uuid% = UUID, %reason% = reason)
    ban-command: ''
    # Command run on unban
    unban-command: ''

# ---- Last Stand ----
last-stand:
  enabled: true
  # Chance (0.0 - 1.0) to survive a lethal hit when at minimum hearts
  chance: 0.05
  cooldown-seconds: 300
  message: '&6Last Stand! &7You narrowly survived!'

# ---- Heart Item ----
heart-item:
  material: NETHER_STAR
  name: '&c❤ Heart'
  lore:
    - '&7Right-click to consume'
    - '&7and gain &c+1 &7max heart.'
    - ''
    - '&8You have &c%hearts%&8/&c%max% &8hearts.'
  custom-model-data: 1001
  glow: true
  refuse-if-at-cap: true

# ---- Heart Shards ----
heart-shard:
  enabled: true
  material: PRISMARINE_SHARD
  name: '&dHeart Shard'
  lore:
    - '&7Collect &d9 &7to craft a &c❤ Heart&7.'
    - '&7Drop from bosses & elites.'
  custom-model-data: 1002
  glow: false
  craft-heart-from-9-shards: true

# ---- Revive Token ----
revive-token:
  enabled: true
  material: NETHER_STAR
  name: '&a✦ Revive Token'
  lore:
    - '&7Use on a &cdeathbanned &7player'
    - '&7to restore them to life.'
  custom-model-data: 1003
  glow: true
  consume-on-use: true
  allow-self-revive: false
  require-permission: false
  permission: 'minesteal.revive'
  # Optional crafting recipe
  recipe:
    enabled: true
    type: SHAPED
    shape:
      - 'SHS'
      - 'HNH'
      - 'SHS'
    # S=Shard, H=Heart, N=Nether Star (extra material)
    extra-material: NETHER_STAR

# ---- PvE Drops ----
pve-drops:
  enabled: true
  entities:
    WARDEN:
      chance: 1.0
      min: 2
      max: 4
      item: SHARD
    WITHER:
      chance: 1.0
      min: 2
      max: 3
      item: SHARD
    ENDER_DRAGON:
      chance: 1.0
      min: 1
      max: 1
      item: TOKEN
    ELDER_GUARDIAN:
      chance: 0.65
      min: 1
      max: 2
      item: SHARD
    RAVAGER:
      chance: 0.45
      min: 1
      max: 2
      item: SHARD
    PILLAGER:
      chance: 0.10
      min: 1
      max: 1
      item: SHARD

# ---- Combat Logging ----
combat-log:
  enabled: true
  # Seconds before combat tag expires
  combat-duration: 15
  # Kill combat-logger on quit
  kill-on-quit: true
  # Play lightning at logger location
  lightning-on-quit: true
  # Create a fake player NPC (requires Citizens) — set to false if not using Citizens
  fake-npc: false
  # Announce combat log to all nearby players
  broadcast: true
  broadcast-range: 100

# ---- Killstreaks ----
killstreak:
  enabled: true
  # Streaks: threshold -> reward config
  streaks:
    3:
      title: '&6Killing Spree!'
      sound: ENTITY_ENDER_DRAGON_GROWL
      broadcast: '&6%player% &7is on a &63 kill streak!'
    5:
      title: '&cRampage!'
      sound: ENTITY_WITHER_SPAWN
      broadcast: '&c%player% &7is on a &c5 kill streak!'
      commands:
        - 'give %player% diamond 1'
    10:
      title: '&4UNSTOPPABLE!'
      sound: ENTITY_ENDER_DRAGON_DEATH
      broadcast: '&4%player% &7is UNSTOPPABLE with &4%streak% &7kills!'
      commands:
        - 'give %player% netherite_ingot 1'
    25:
      title: '&5GODLIKE!'
      sound: ENTITY_WITHER_DEATH
      broadcast: '&5%player% &7is GODLIKE with &5%streak% &7kills!'
      commands:
        - 'give %player% netherite_ingot 3'

# ---- Bounty System ----
bounty:
  enabled: true
  # Minimum bounty amount
  min-amount: 100.0
  # Maximum bounty amount
  max-amount: 1000000.0
  # Tax percentage taken from bounty pot (0 = no tax)
  tax-percent: 0
  # Allow placing bounty on yourself
  allow-self: false
  # Require Vault economy
  require-economy: true
  # Bounty expiry in hours (0 = never)
  expiry-hours: 72
  # Announce new bounties globally
  broadcast-new: true
  # Show bounty target above their head (requires DecentHolograms)
  hologram: false

# ---- PvP Protection (new players) ----
pvp-timer:
  enabled: true
  # Seconds of PvP protection for new players
  duration: 300
  # Disable on first kill or attack
  cancel-on-attack: true
  cancel-on-damage-taken: true

# ---- Anti-Abuse ----
anti-abuse:
  enabled: true
  # Cooldown between counting kills from same player (seconds)
  same-player-kill-cooldown: 300
  # Maximum kills of same player counted per day
  same-player-daily-limit: 3
  # Detect same-IP alts
  ip-farming-prevention: true
  # Block kills against players with < X hearts (prevent kill-farming weak players)
  min-victim-hearts-for-steal: 5

# ---- Totem Interactions ----
totem:
  # Count totem pops as "near death" — don't steal hearts on totem trigger
  prevent-steal-on-totem: true
  # Allow heart steal if victim has < N hearts AND uses totem
  steal-on-totem-if-low: false
  low-heart-threshold: 6

# ---- Heart Regeneration ----
heart-regen:
  enabled: false
  # Hearts regenerated per event
  amount: 1
  # Event: DAILY, WEEKLY, INTERVAL
  mode: INTERVAL
  # Seconds between regen (when mode=INTERVAL)
  interval-seconds: 86400
  # Maximum hearts regen can restore to (0 = use global max)
  max-regen-hearts: 0

# ---- Seasonal Reset ----
seasonal-reset:
  enabled: false
  # Cron-style or manual — set via admin command
  reset-message: '&6Season reset! All hearts have been reset to starting values.'

# ---- GUI ----
gui:
  hearts:
    title: '&c❤ Your Hearts'
    size: 27
    fill-item: BLACK_STAINED_GLASS_PANE
  admin:
    title: '&4⚙ Admin Panel'
    size: 54
  bounty:
    title: '&6☠ Bounty Board'
    size: 54
  stats:
    title: '&b📊 Statistics'
    size: 54

# ---- Holograms (DecentHolograms) ----
holograms:
  enabled: true
  id-prefix: 'ms_top'
  update-period-seconds: 20
  header: '&c&lTop Hearts'
  entry: '&c#%rank% &7%name%: &c%hearts% ❤'

# ---- Withdraw ----
withdraw:
  withdraw-as-shards: false
  shards-per-heart: 9

# ---- Cooldowns (seconds) ----
cooldowns:
  consume: 5
  withdraw: 2
  deposit: 2
  give: 10
  revive-request: 60
  gui-click-ms: 150
  bounty-place: 30

# ---- Leaderboard ----
leaderboard:
  page-size: 10
  include-offline: true

# ---- Vault Economy ----
economy:
  enabled: true
  # Award money on kill (requires Vault)
  reward-on-kill: 0.0
  # Deduct money on death
  cost-on-death: 0.0
