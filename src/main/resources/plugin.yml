name: MineSteal
main: me.ycxmbo.minesteal.MineSteal
version: ${project.version}
api-version: '1.21'
authors: [ 'yCxmbo' ]
description: 'Professional Lifesteal SMP plugin with heart stealing, bounties, stats and more.'
website: 'https://github.com/ycxmbo/minesteal'
softdepend: [ PlaceholderAPI, DecentHolograms, Vault ]

commands:
  minesteal:
    description: 'Main MineSteal command hub.'
    usage: '/<command> <subcommand> [args]'
    aliases: [ ms, lifesteal, ls ]

  # Legacy aliases kept for backwards compatibility
  hearts:
    description: 'View your hearts (alias for /minesteal hearts).'
    usage: '/<command>'
    aliases: [ heart ]
  revive:
    description: 'Revive a deathbanned player (alias).'
    usage: '/<command> <player>'
  msgive:
    description: 'Give MineSteal items (admin).'
    usage: '/<command> <heart|shard|token> <player> [amount]'
    permission: minesteal.admin

permissions:
  minesteal.admin:
    description: 'Full administrative access.'
    default: op
    children:
      minesteal.hearts.admin: true
      minesteal.revive.admin: true
      minesteal.sethearts: true
      minesteal.addhearts: true
      minesteal.removehearts: true
      minesteal.reload: true
      minesteal.admin.give: true
      minesteal.bypassban: true
      minesteal.combatlog.admin: true
      minesteal.bounty.admin: true

  minesteal.use:
    description: 'Basic plugin access.'
    default: true

  minesteal.hearts:
    description: 'View own hearts.'
    default: true

  minesteal.withdraw:
    description: 'Withdraw hearts into items.'
    default: true

  minesteal.deposit:
    description: 'Deposit heart items.'
    default: true

  minesteal.give:
    description: 'Transfer hearts to another player.'
    default: true

  minesteal.revive:
    description: 'Use a revive token to revive another player.'
    default: true

  minesteal.revive.admin:
    description: 'Revive without consuming a token.'
    default: op

  minesteal.bounty:
    description: 'Place bounties on players.'
    default: true

  minesteal.bounty.admin:
    description: 'Admin bounty management.'
    default: op

  minesteal.stats:
    description: 'View stats leaderboard.'
    default: true

  minesteal.reload:
    description: 'Reload plugin configuration.'
    default: op

  minesteal.bypassban:
    description: 'Bypass deathban restrictions.'
    default: op

  minesteal.sethearts:
    description: 'Set a player heart count.'
    default: op

  minesteal.addhearts:
    description: 'Add hearts to a player.'
    default: op

  minesteal.removehearts:
    description: 'Remove hearts from a player.'
    default: op

  minesteal.hearts.admin:
    description: 'Admin heart management.'
    default: op

  minesteal.admin.give:
    description: 'Spawn heart/shard/token items.'
    default: op

  minesteal.combatlog.admin:
    description: 'View and manage combat logs.'
    default: op

  minesteal.killtop:
    description: 'View kill leaderboard.'
    default: true
